<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Minion Swarm</title>
  <style>
    :root { color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: #0f1a12; font-family: var(--game-font, system-ui, sans-serif); color: #e8f5ea; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    /* Game width: fill the phone, keeping the 360x560 canvas shape. Buttons are drawn inside it. */
    :root { --w: min(calc(100vw - 32px), calc((100vh - 32px) * 0.643)); }
    @supports (height: 100dvh) { :root { --w: min(calc(100vw - 32px), calc((100dvh - 32px) * 0.643)); } }
    .stage { position: relative; width: var(--w); }
    canvas { display: block; width: 100%; height: auto; background: #1f3a24;
      border-radius: 12px; touch-action: none; -webkit-user-select: none; user-select: none; }
    /* Tuning buttons (⚙ and 🎨) at the top center, out of the way of the HUD. */
    .stage .sp-gear { left: calc(50% - 40px); }
    .stage .ap-btn { top: 8px; left: calc(50% + 4px); }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="game" width="360" height="560"></canvas>
  </div>
  <script src="../shared/settings-panel.js?v=36"></script>
  <script src="../shared/asset-panel.js?v=36"></script>
  <script src="game.js?v=36"></script>
</body>
</html>
