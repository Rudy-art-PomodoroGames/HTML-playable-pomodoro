<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Connect &amp; Earn</title>
  <style>
    :root { color-scheme: light; }
    html, body { margin: 0; height: 100%; background: #f3dcae; font-family: var(--game-font, system-ui, sans-serif); color: #5a3a1e; }
    body { display: flex; flex-direction: column; align-items: center; justify-content: center; }
    /* Game width: fill the phone, keeping the 360x560 canvas shape. Buttons are drawn inside it. */
    :root { --w: min(calc(100vw - 32px), calc((100vh - 32px) * 0.643)); }
    @supports (height: 100dvh) { :root { --w: min(calc(100vw - 32px), calc((100dvh - 32px) * 0.643)); } }
    .stage { position: relative; width: var(--w); }
    canvas { display: block; width: 100%; height: auto; background: #f6e3bd;
      border-radius: 12px; touch-action: none; -webkit-user-select: none; user-select: none; }
    /* Tuning buttons (⚙ 🎨 🕹) at the top center, out of the way of the HUD. */
    .stage .sp-gear { left: calc(50% - 62px); }
    .stage .ap-btn { top: 8px; left: calc(50% - 18px); }
    .stage .cp-btn { left: calc(50% + 26px); }
    /* Hidden until the cheat (double-tap the top-left corner of the game). */
    body:not(.tools-on) .sp-gear, body:not(.tools-on) .ap-btn, body:not(.tools-on) .cp-btn { display: none; }
  </style>
</head>
<body>
  <div class="stage">
    <canvas id="game" width="360" height="560"></canvas>
  </div>
  <script src="../shared/settings-panel.js?v=2"></script>
  <script src="../shared/asset-panel.js?v=2"></script>
  <script src="../shared/cheat-panel.js?v=2"></script>
  <script src="game.js?v=2"></script>
</body>
</html>
